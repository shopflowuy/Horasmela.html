<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Horas - HorasMel</title>
  <style>
    :root {
      --primary: #4a90e2;
      --primary-dark: #357abd;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #dddddd;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--primary-dark);
      font-size: 24px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #555;
      border-bottom: 2px solid #eee;
      padding-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Resumen Principal */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
    }

    .summary-box {
      background: #f8f9fa;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
    }

    .summary-box .val {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-dark);
      margin-top: 4px;
    }

    .summary-box .lbl {
      font-size: 11px;
      color: #777;
      text-transform: uppercase;
    }

    /* Lista de Horas por Chofer */
    .choferes-box {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .chofer-linea {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
    }

    /* Formularios */
    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 15px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .btn-cancel {
      background: #888;
      margin-top: 8px;
    }

    .btn-export {
      background: #27ae60;
      font-size: 12px;
      padding: 6px 12px;
      width: auto;
      margin-top: 0;
    }

    /* Tabla */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: center;
    }

    th {
      background: #f1f3f5;
      color: #495057;
    }

    .acciones-grid {
      display: flex;
      gap: 4px;
      justify-content: center;
    }

    .btn-action {
      border: none;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-edit { background: #f39c12; color: white; }
    .btn-del { background: #e74c3c; color: white; }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📋 HorasMel - Registro Mensual</h1>

  <!-- Filtro y Resumen -->
  <div class="card">
    <div class="form-group">
      <label for="filtroMes">Filtrar por Mes:</label>
      <input type="month" id="filtroMes" onchange="renderizar()">
    </div>

    <div class="summary-grid">
      <div class="summary-box">
        <div class="lbl">Días Trabal.</div>
        <div class="val" id="resDias">0</div>
      </div>
      <div class="summary-box">
        <div class="lbl">Total Hs.</div>
        <div class="val" id="resHoras">0.0</div>
      </div>
      <div class="summary-box">
        <div class="lbl">Melany ($)</div>
        <div class="val" id="resSaldo">$0</div>
      </div>
    </div>

    <div class="choferes-box">
      <label style="color: #555; margin-bottom: 6px;">⏱️ Suma de Horas por Chofer:</label>
      <div id="resChoferes">
        <!-- Generado con JS -->
      </div>
    </div>
  </div>

  <!-- Formulario de Registro / Edición -->
  <div class="card">
    <div class="card-title" id="formTitulo">✍️ Registrar Jornada</div>

    <input type="hidden" id="editId">

    <div class="form-group">
      <label for="chofer">Nombre del Chofer:</label>
      <input type="text" id="chofer" placeholder="Ej: Melany">
    </div>

    <div class="row-2">
      <div class="form-group">
        <label for="radio">Radio:</label>
        <select id="radio">
          <option value="900">900</option>
          <option value="901">901</option>
          <option value="902">902</option>
          <option value="903">903</option>
          <option value="904">904</option>
          <option value="905">905</option>
          <option value="Sonda">Sonda</option>
        </select>
      </div>

      <div class="form-group">
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha">
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label for="horaEntrada">Entrada:</label>
        <input type="time" id="horaEntrada">
      </div>
      <div class="form-group">
        <label for="horaSalida">Salida:</label>
        <input type="time" id="horaSalida">
      </div>
    </div>

    <button id="btnGuardar" onclick="guardarJornada()">Guardar Jornada</button>
    <button id="btnCancelar" class="btn-cancel" onclick="limpiarFormulario()" style="display: none;">Cancelar Edición</button>
  </div>

  <!-- Histórico -->
  <div class="card">
    <div class="card-title">
      <span>📅 Detalle del Mes</span>
      <button class="btn-export" onclick="exportarExcel()">📊 Exportar Excel</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Chofer</th>
          <th>Radio</th>
          <th>Hs</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tablaCuerpo">
        <!-- Generado con JS -->
      </tbody>
    </table>
  </div>

  <footer>Creado por Juan Carlos Albin</footer>
</div>

<script>
  const VALOR_HORA = 221;
  let jornadas = JSON.parse(localStorage.getItem('horas_mel_data')) || [];

  document.addEventListener('DOMContentLoaded', () => {
    const hoy = new Date();
    document.getElementById('fecha').value = hoy.toISOString().split('T')[0];
    
    const mesActual = hoy.toISOString().slice(0, 7);
    document.getElementById('filtroMes').value = mesActual;

    renderizar();
  });

  function guardarJornada() {
    const editId = document.getElementById('editId').value;
    const chofer = document.getElementById('chofer').value.trim();
    const radio = document.getElementById('radio').value;
    const fecha = document.getElementById('fecha').value;
    const horaEntrada = document.getElementById('horaEntrada').value;
    const horaSalida = document.getElementById('horaSalida').value;

    if (!fecha || !horaEntrada || !horaSalida) {
      alert("Por favor completa la fecha y los horarios.");
      return;
    }

    const entrada = new Date(`${fecha}T${horaEntrada}`);
    const salida = new Date(`${fecha}T${horaSalida}`);

    let diffMs = salida - entrada;
    if (diffMs < 0) {
      diffMs += 24 * 60 * 60 * 1000;
    }

    const horasTrabajadas = diffMs / (1000 * 60 * 60);

    if (horasTrabajadas === 0) {
      alert("La hora de salida debe ser distinta a la de entrada.");
      return;
    }

    if (editId) {
      // Modificar existente
      jornadas = jornadas.map(j => j.id == editId ? {
        id: Number(editId),
        chofer: chofer || 'Sin nombre',
        radio,
        fecha,
        horaEntrada,
        horaSalida,
        horas: horasTrabajadas
      } : j);
    } else {
      // Crear nuevo
      const nuevaJornada = {
        id: Date.now(),
        chofer: chofer || 'Sin nombre',
        radio,
        fecha,
        horaEntrada,
        horaSalida,
        horas: horasTrabajadas
      };
      jornadas.push(nuevaJornada);
    }

    localStorage.setItem('horas_mel_data', JSON.stringify(jornadas));
    limpiarFormulario();
    renderizar();
  }

  function editarJornada(id) {
    const reg = jornadas.find(j => j.id === id);
    if (!reg) return;

    document.getElementById('editId').value = reg.id;
    document.getElementById('chofer').value = reg.chofer === 'Sin nombre' ? '' : reg.chofer;
    document.getElementById('radio').value = reg.radio;
    document.getElementById('fecha').value = reg.fecha;
    document.getElementById('horaEntrada').value = reg.horaEntrada;
    document.getElementById('horaSalida').value = reg.horaSalida;

    document.getElementById('formTitulo').innerText = "✏️ Modificar Jornada";
    document.getElementById('btnGuardar').innerText = "Guardar Cambios";
    document.getElementById('btnCancelar').style.display = "block";

    window.scrollTo({ top: 150, behavior: 'smooth' });
  }

  function limpiarFormulario() {
    document.getElementById('editId').value = '';
    document.getElementById('chofer').value = '';
    document.getElementById('horaEntrada').value = '';
    document.getElementById('horaSalida').value = '';
    document.getElementById('formTitulo').innerText = "✍️ Registrar Jornada";
    document.getElementById('btnGuardar').innerText = "Guardar Jornada";
    document.getElementById('btnCancelar').style.display = "none";
  }

  function borrarJornada(id) {
    if (confirm("¿Borrar este registro?")) {
      jornadas = jornadas.filter(j => j.id !== id);
      localStorage.setItem('horas_mel_data', JSON.stringify(jornadas));
      renderizar();
    }
  }

  function renderizar() {
    const mesSeleccionado = document.getElementById('filtroMes').value;
    const tbody = document.getElementById('tablaCuerpo');
    tbody.innerHTML = '';

    const jornadasFiltradas = jornadas.filter(j => j.fecha.startsWith(mesSeleccionado));
    jornadasFiltradas.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

    let totalHorasGlobal = 0;
    let totalHorasMelany = 0;
    const diasUnicos = new Set();
    const sumaPorChofer = {};

    jornadasFiltradas.forEach(j => {
      totalHorasGlobal += j.horas;
      diasUnicos.add(j.fecha);

      const nombreChofer = j.chofer.trim();
      sumaPorChofer[nombreChofer] = (sumaPorChofer[nombreChofer] || 0) + j.horas;

      // Sumar al saldo si se llama Melany (sin importar mayúsculas/minúsculas)
      if (nombreChofer.toLowerCase().includes('melany')) {
        totalHorasMelany += j.horas;
      }

      const tr = document.createElement('tr');
      const partesFecha = j.fecha.split('-');
      const fechaFormateada = `${partesFecha[2]}/${partesFecha[1]}`;

      tr.innerHTML = `
        <td><strong>${j.chofer}</strong><br><small style="color:#777">${fechaFormateada} (${j.horaEntrada}-${j.horaSalida})</small></td>
        <td>${j.radio}</td>
        <td>${j.horas.toFixed(2)} hs</td>
        <td>
          <div class="acciones-grid">
            <button class="btn-action btn-edit" onclick="editarJornada(${j.id})">✏️</button>
            <button class="btn-action btn-del" onclick="borrarJornada(${j.id})">✕</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });

    // Actualizar resúmenes
    const saldoMelany = totalHorasMelany * VALOR_HORA;
    document.getElementById('resDias').innerText = diasUnicos.size;
    document.getElementById('resHoras').innerText = totalHorasGlobal.toFixed(1);
    document.getElementById('resSaldo').innerText = "$" + Math.round(saldoMelany).toLocaleString();

    // Actualizar desglose de choferes
    const divChoferes = document.getElementById('resChoferes');
    divChoferes.innerHTML = '';
    const listaNombres = Object.keys(sumaPorChofer);

    if (listaNombres.length === 0) {
      divChoferes.innerHTML = '<div class="chofer-linea" style="color:#888;">No hay registros este mes</div>';
    } else {
      listaNombres.forEach(nombre => {
        const div = document.createElement('div');
        div.className = 'chofer-linea';
        div.innerHTML = `<span><strong>${nombre}:</strong></span> <span>${sumaPorChofer[nombre].toFixed(2)} hs</span>`;
        divChoferes.appendChild(div);
      });
    }
  }

  function exportarExcel() {
    const mesSeleccionado = document.getElementById('filtroMes').value;
    const jornadasFiltradas = jornadas.filter(j => j.fecha.startsWith(mesSeleccionado));

    if (jornadasFiltradas.length === 0) {
      alert("No hay registros guardados en este mes para exportar.");
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,Chofer,Fecha,Radio,Entrada,Salida,Horas Trabajadas,Monto Melany ($221/h)\n";

    jornadasFiltradas.forEach(j => {
      const esMelany = j.chofer.toLowerCase().includes('melany');
      const monto = esMelany ? (j.horas * VALOR_HORA).toFixed(2) : '0.00';
      csvContent += `"${j.chofer}",${j.fecha},${j.radio},${j.horaEntrada},${j.horaSalida},${j.horas.toFixed(2)},${monto}\n`;
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `Reporte_Horas_${mesSeleccionado}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>

</body>
</html>
